; hardening-lab HL-FW-001: no hay systemd en el nodo; supervisord carga /etc/nftables.conf al arrancar.
[program:nftables]
command=/usr/sbin/nft -f /etc/nftables.conf
autostart=true
autorestart=false
startsecs=0
startretries=0
exitcodes=0
priority=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
