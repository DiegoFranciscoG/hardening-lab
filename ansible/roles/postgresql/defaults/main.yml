---
postgresql_conf_dir: /etc/postgresql/16/main
postgresql_listen: "localhost,{{ lab_ip.data }}"
postgresql_web_ip: "{{ hostvars['lab-web'].lab_ip.data }}"
postgresql_settings:
  listen_addresses: "'{{ postgresql_listen }}'"
  password_encryption: scram-sha-256
  log_connections: "on"
  log_disconnections: "on"
  log_line_prefix: "'%m [%p] %q%u@%d '"
