    domain: services
    title_es: Solo los servicios de red que exige el rol del host
    severity: medium
    method: examine
    applies_to: [bastion, web, db]
    remediation: {role: services, tags: [services]}
    evidence: [listening_ports, services]
    refs:
      - {framework: cis_ubuntu2404_v1, ref_id: "2.1.1"}
      - {framework: cis_ubuntu2404_v1, ref_id: "2.1.2"}
      - {framework: cis_ubuntu2404_v1, ref_id: "2.1.6"}
      - {framework: cis_ubuntu2404_v1, ref_id: "2.1.10"}
      - {framework: cis_ubuntu2404_v1, ref_id: "2.1.13"}
      - {framework: cis_ubuntu2404_v1, ref_id: "2.1.16"}
      - {framework: cis_ubuntu2404_v1, ref_id: "2.1.18"}

  - control_id: HL-SVC-003
    domain: services
    title_es: Sin prelink ni reporte automático de errores
    severity: low
    method: examine
    applies_to: [bastion, web, db]
    remediation: {role: services, tags: [packages]}
    refs:
      - {framework: cis_ubuntu2404_v1, ref_id: "1.5.4"}
      - {framework: cis_ubuntu2404_v1, ref_id: "1.5.5"}

  - control_id: HL-SVC-004
    domain: services
    title_es: Verificación periódica de integridad de archivos (AIDE)
    severity: medium
    method: examine
    applies_to: [bastion, web, db]
    refs:
      - {framework: cis_ubuntu2404_v1, ref_id: "6.3.1"}
