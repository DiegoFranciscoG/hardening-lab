  - control_id: HL-PERM-003
    domain: file_permissions
    title_es: cron y at restringidos y con permisos de solo root
    severity: medium
    method: examine
    applies_to: [bastion, web, db]
    remediation: {role: file_permissions, tags: [permissions]}
    evidence: [file_permissions]
    refs:
      - {framework: cis_ubuntu2404_v1, ref_id: "2.4.1.2"}
      - {framework: cis_ubuntu2404_v1, ref_id: "2.4.1.3"}
      - {framework: cis_ubuntu2404_v1, ref_id: "2.4.1.4"}
      - {framework: cis_ubuntu2404_v1, ref_id: "2.4.1.5"}
      - {framework: cis_ubuntu2404_v1, ref_id: "2.4.1.6"}
      - {framework: cis_ubuntu2404_v1, ref_id: "2.4.1.7"}
      - {framework: cis_ubuntu2404_v1, ref_id: "2.4.1.8"}
      - {framework: cis_ubuntu2404_v1, ref_id: "2.4.2.1"}
    assertions:
      - {probe: file_permissions, pattern: '^600 root:root /etc/crontab$'}

  - control_id: HL-PERM-004
    domain: file_permissions
    title_es: Directorios personales y archivos de inicio de usuario protegidos
    severity: medium
    method: examine
    applies_to: [bastion, web, db]
    remediation: {role: file_permissions, tags: [permissions]}
    refs:
      - {framework: cis_ubuntu2404_v1, ref_id: "7.2.9"}
      - {framework: cis_ubuntu2404_v1, ref_id: "7.2.10"}

