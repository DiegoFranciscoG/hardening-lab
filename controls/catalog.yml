    refs:
      - {framework: cis_ubuntu2404_v1, ref_id: "2.2.1"}
      - {framework: cis_ubuntu2404_v1, ref_id: "2.2.2"}
      - {framework: cis_ubuntu2404_v1, ref_id: "2.2.3"}
      - {framework: cis_ubuntu2404_v1, ref_id: "2.2.4"}
      - {framework: cis_ubuntu2404_v1, ref_id: "2.2.5"}
