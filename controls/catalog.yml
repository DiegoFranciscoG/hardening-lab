      - {framework: cis_ubuntu2404_v1, ref_id: "7.1.2"}
      - {framework: cis_ubuntu2404_v1, ref_id: "7.1.3"}
      - {framework: cis_ubuntu2404_v1, ref_id: "7.1.4"}
      - {framework: cis_ubuntu2404_v1, ref_id: "7.1.5"}
      - {framework: cis_ubuntu2404_v1, ref_id: "7.1.6"}
      - {framework: cis_ubuntu2404_v1, ref_id: "7.1.7"}
      - {framework: cis_ubuntu2404_v1, ref_id: "7.1.8"}
      - {framework: cis_ubuntu2404_v1, ref_id: "7.1.9"}
      - {framework: cis_ubuntu2404_v1, ref_id: "7.1.10"}

