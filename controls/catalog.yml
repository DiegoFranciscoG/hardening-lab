# Catálogo de controles de hardening-lab.
# - control_id: identificador propio y estable (no cambia si CIS renumera entre v1.0.0 y v2.0.0).
# - title_es: redacción propia; no se copia texto de CIS (CC BY-NC-SA 4.0), solo su ID.
# - refs: de dónde sale el estado. cis_ubuntu2404_v1 toma todas las reglas SSG que citan ese ID CIS.
# - assertions: expectativas sobre la evidencia guardada (método "examine" de NIST SP 800-53A).
# - Las tareas Ansible que remedian un control se llaman "HL-XXX-NNN | ...": el modo check las enlaza solo.
controls:
  # ------------------------------------------------------------------ SSH
  - control_id: HL-SSH-001
    domain: ssh
    title_es: Acceso directo de root por SSH deshabilitado
    severity: high
    method: examine
    applies_to: [bastion, web, db]
    remediation: {role: ssh, tags: [ssh]}
    evidence: [sshd_effective]
    refs:
      - {framework: cis_ubuntu2404_v1, ref_id: "5.1.20"}
      - {framework: lynis, ref_id: SSH-7408, match: PermitRootLogin}
    assertions:
      - {probe: sshd_effective, pattern: '^permitrootlogin no$'}

  - control_id: HL-SSH-002
    domain: ssh
    title_es: Autenticación SSH solo con clave pública, sin contraseñas ni contraseñas vacías
    severity: high
    method: examine
    applies_to: [bastion, web, db]
    remediation: {role: ssh, tags: [ssh]}
    evidence: [sshd_effective]
    refs:
      - {framework: cis_ubuntu2404_v1, ref_id: "5.1.19"}
    assertions:
      - {probe: sshd_effective, pattern: '^passwordauthentication no$'}
      - {probe: sshd_effective, pattern: '^kbdinteractiveauthentication no$'}
      - {probe: sshd_effective, pattern: '^permitemptypasswords no$'}
      - {probe: sshd_effective, pattern: '^pubkeyauthentication yes$'}

  - control_id: HL-SSH-003
    domain: ssh
    title_es: Cifrados, MAC e intercambio de claves SSH sin algoritmos débiles
    severity: medium
    method: examine
    applies_to: [bastion, web, db]
    remediation: {role: ssh, tags: [ssh]}
    evidence: [sshd_effective]
    refs:
      - {framework: cis_ubuntu2404_v1, ref_id: "5.1.6"}
      - {framework: cis_ubuntu2404_v1, ref_id: "5.1.12"}
      - {framework: cis_ubuntu2404_v1, ref_id: "5.1.15"}
    assertions:
      - {probe: sshd_effective, pattern: '^ciphers .*(cbc|arcfour|3des|chacha20)', expect: absent}
      - {probe: sshd_effective, pattern: '^macs .*(md5|hmac-sha1|umac-64|-96)', expect: absent}
      - {probe: sshd_effective, pattern: '^kexalgorithms .*(group1-sha1|group14-sha1|exchange-sha1)', expect: absent}

  - control_id: HL-SSH-004
    domain: ssh
    title_es: Intentos de autenticación, sesiones y conexiones no autenticadas limitados
    severity: medium
    method: examine
    applies_to: [bastion, web, db]
    remediation: {role: ssh, tags: [ssh]}
    evidence: [sshd_effective]
    refs:
      - {framework: cis_ubuntu2404_v1, ref_id: "5.1.13"}
      - {framework: cis_ubuntu2404_v1, ref_id: "5.1.16"}
      - {framework: cis_ubuntu2404_v1, ref_id: "5.1.17"}
      - {framework: cis_ubuntu2404_v1, ref_id: "5.1.18"}
      - {framework: lynis, ref_id: SSH-7408, match: 'MaxAuthTries|MaxSessions'}
    assertions:
      - {probe: sshd_effective, pattern: '^maxauthtries [1-4]$'}
      - {probe: sshd_effective, pattern: '^logingracetime ([1-9]|[1-5][0-9]|60)$'}

  - control_id: HL-SSH-005
    domain: ssh
    title_es: Reenvíos SSH (X11, TCP, agente y túneles) deshabilitados
    severity: medium
    method: examine
    applies_to: [bastion, web, db]
    remediation: {role: ssh, tags: [ssh]}
    evidence: [sshd_effective]
    refs:
      - {framework: cis_ubuntu2404_v1, ref_id: "5.1.8"}
      - {framework: lynis, ref_id: SSH-7408, match: 'X11Forwarding|AllowTcpForwarding|AllowAgentForwarding'}
    assertions:
      - {probe: sshd_effective, pattern: '^disableforwarding yes$'}
      - {probe: sshd_effective, pattern: '^x11forwarding no$'}

  - control_id: HL-SSH-006
    domain: ssh
    title_es: Sesiones SSH inactivas se cierran automáticamente
    severity: medium
    method: examine
    applies_to: [bastion, web, db]
    remediation: {role: ssh, tags: [ssh]}
    evidence: [sshd_effective]
    refs:
      - {framework: cis_ubuntu2404_v1, ref_id: "5.1.7"}
      - {framework: lynis, ref_id: SSH-7408, match: TCPKeepAlive}
    assertions:
      - {probe: sshd_effective, pattern: '^clientaliveinterval ([1-9][0-9]?|[12][0-9]{2}|300)$'}
      - {probe: sshd_effective, pattern: '^clientalivecountmax [1-3]$'}

  - control_id: HL-SSH-007
    domain: ssh
    title_es: Registro detallado de eventos SSH
    severity: low
    method: examine
    applies_to: [bastion, web, db]
    remediation: {role: ssh, tags: [ssh]}
    evidence: [sshd_effective]
    refs:
      - {framework: cis_ubuntu2404_v1, ref_id: "5.1.14"}
      - {framework: lynis, ref_id: SSH-7408, match: LogLevel}
    assertions:
      - {probe: sshd_effective, pattern: '^loglevel verbose$'}

  - control_id: HL-SSH-008
    domain: ssh
    title_es: Acceso SSH restringido a un grupo autorizado y con aviso legal
    severity: medium
    method: examine
    applies_to: [bastion, web, db]
    remediation: {role: ssh, tags: [ssh]}
    evidence: [sshd_effective]
    refs:
      - {framework: cis_ubuntu2404_v1, ref_id: "5.1.4"}
      - {framework: cis_ubuntu2404_v1, ref_id: "5.1.5"}
    assertions:
      - {probe: sshd_effective, pattern: '^allowgroups sshusers$'}
      - {probe: sshd_effective, pattern: '^banner /etc/issue\.net$'}

  - control_id: HL-SSH-009
    domain: ssh
    title_es: Sin autenticación por host, rhosts, GSSAPI ni variables de entorno del usuario
    severity: medium
    method: examine
    applies_to: [bastion, web, db]
    remediation: {role: ssh, tags: [ssh]}
    evidence: [sshd_effective]
    refs:
      - {framework: cis_ubuntu2404_v1, ref_id: "5.1.9"}
      - {framework: cis_ubuntu2404_v1, ref_id: "5.1.10"}
      - {framework: cis_ubuntu2404_v1, ref_id: "5.1.11"}
      - {framework: cis_ubuntu2404_v1, ref_id: "5.1.21"}
      - {framework: cis_ubuntu2404_v1, ref_id: "5.1.22"}
    assertions:
      - {probe: sshd_effective, pattern: '^hostbasedauthentication no$'}
      - {probe: sshd_effective, pattern: '^ignorerhosts yes$'}
      - {probe: sshd_effective, pattern: '^permituserenvironment no$'}
      - {probe: sshd_effective, pattern: '^gssapiauthentication no$'}

  - control_id: HL-SSH-010
    domain: ssh
    title_es: Permisos de la configuración SSH y de las claves de host
    severity: medium
    method: examine
    applies_to: [bastion, web, db]
    remediation: {role: ssh, tags: [ssh]}
    evidence: [sshd_files]
    refs:
      - {framework: cis_ubuntu2404_v1, ref_id: "5.1.1"}
      - {framework: cis_ubuntu2404_v1, ref_id: "5.1.2"}
      - {framework: cis_ubuntu2404_v1, ref_id: "5.1.3"}
    assertions:
      - {probe: sshd_files, pattern: '^600 root:root /etc/ssh/sshd_config$'}

  - control_id: HL-SSH-011
    domain: ssh
    title_es: Bloqueo automático de fuerza bruta SSH en el bastión (fail2ban)
    severity: medium
    method: examine
    applies_to: [bastion]
    remediation: {role: fail2ban, tags: [fail2ban]}
    evidence: [fail2ban]
    assertions:
      - {probe: fail2ban, pattern: 'Status for the jail: sshd'}

  # ------------------------------------------------------------------ cuentas
  - control_id: HL-ACC-001
    domain: accounts
    title_es: Caducidad, aviso e inactividad de contraseñas definidos
    severity: medium
    method: examine
    applies_to: [bastion, web, db]
    remediation: {role: accounts, tags: [accounts]}
    evidence: [accounts]
    refs:
      - {framework: cis_ubuntu2404_v1, ref_id: "5.4.1.1"}
      - {framework: cis_ubuntu2404_v1, ref_id: "5.4.1.3"}
      - {framework: cis_ubuntu2404_v1, ref_id: "5.4.1.5"}
      - {framework: lynis, ref_id: AUTH-9286}
    assertions:
      - {probe: accounts, pattern: '^PASS_MAX_DAYS\s+365$'}
      - {probe: accounts, pattern: '^INACTIVE=45$'}

  - control_id: HL-ACC-002
    domain: accounts
    title_es: Hash de contraseñas fuerte (yescrypt) con rondas configuradas
    severity: medium
    method: examine
    applies_to: [bastion, web, db]
    remediation: {role: accounts, tags: [accounts]}
    evidence: [accounts]
    refs:
      - {framework: cis_ubuntu2404_v1, ref_id: "5.4.1.4"}
      - {framework: cis_ubuntu2404_v1, ref_id: "5.3.3.4.3"}
      - {framework: lynis, ref_id: AUTH-9230}
    assertions:
      - {probe: accounts, pattern: '^ENCRYPT_METHOD\s+YESCRYPT$'}

  - control_id: HL-ACC-003
    domain: accounts
    title_es: Cuentas de sistema sin shell de inicio de sesión
    severity: medium
    method: examine
    applies_to: [bastion, web, db]
    remediation: {role: accounts, tags: [accounts]}
    evidence: [accounts]
    refs:
      - {framework: cis_ubuntu2404_v1, ref_id: "5.4.2.7"}
      - {framework: cis_ubuntu2404_v1, ref_id: "5.4.2.8"}

  - control_id: HL-ACC-004
    domain: accounts
    title_es: Solo root tiene UID/GID 0 y su PATH no contiene rutas inseguras
    severity: high
    method: examine
    applies_to: [bastion, web, db]
    remediation: {role: accounts, tags: [accounts]}
    evidence: [accounts]
    refs:
      - {framework: cis_ubuntu2404_v1, ref_id: "5.4.2.1"}
      - {framework: cis_ubuntu2404_v1, ref_id: "5.4.2.2"}
      - {framework: cis_ubuntu2404_v1, ref_id: "5.4.2.3"}
      - {framework: cis_ubuntu2404_v1, ref_id: "5.4.2.5"}

  - control_id: HL-ACC-005
    domain: accounts
    title_es: umask restrictiva (027) y cierre de shells inactivas
    severity: medium
    method: examine
    applies_to: [bastion, web, db]
    remediation: {role: accounts, tags: [accounts]}
    evidence: [accounts]
    refs:
      - {framework: cis_ubuntu2404_v1, ref_id: "5.4.2.6"}
      - {framework: cis_ubuntu2404_v1, ref_id: "5.4.3.2"}
      - {framework: cis_ubuntu2404_v1, ref_id: "5.4.3.3"}
      - {framework: lynis, ref_id: AUTH-9328}
    assertions:
      - {probe: accounts, pattern: '^UMASK\s+027$'}

  - control_id: HL-ACC-006
    domain: accounts
    title_es: Cuenta heredada sin escalada de privilegios sin contraseña
    severity: high
    method: examine
    applies_to: [bastion, web, db]
    remediation: {role: accounts, tags: [accounts]}
    evidence: [sudoers]
    assertions:
      - {probe: sudoers, pattern: '^deploy\s.*NOPASSWD', expect: absent}

  # ------------------------------------------------------------------ sudo y PAM
  - control_id: HL-SUDO-001
    domain: sudo_pam
    title_es: sudo con pseudo-terminal y archivo de registro propio
    severity: medium
    method: examine
    applies_to: [bastion, web, db]
    remediation: {role: accounts, tags: [sudo]}
    evidence: [sudoers]
    refs:
      - {framework: cis_ubuntu2404_v1, ref_id: "5.2.2"}
      - {framework: cis_ubuntu2404_v1, ref_id: "5.2.3"}
    assertions:
      - {probe: sudoers, pattern: 'Defaults\s+use_pty'}
      - {probe: sudoers, pattern: 'Defaults\s+logfile="?/var/log/sudo\.log'}

  - control_id: HL-SUDO-002
    domain: sudo_pam
    title_es: Reautenticación de sudo con tiempo de espera acotado
    severity: medium
    method: examine
    applies_to: [bastion, web, db]
    remediation: {role: accounts, tags: [sudo]}
    evidence: [sudoers]
    refs:
      - {framework: cis_ubuntu2404_v1, ref_id: "5.2.5"}
      - {framework: cis_ubuntu2404_v1, ref_id: "5.2.6"}

  - control_id: HL-SUDO-003
    domain: sudo_pam
    title_es: Uso de su restringido a un grupo vacío
    severity: medium
    method: examine
    applies_to: [bastion, web, db]
    remediation: {role: accounts, tags: [sudo]}
    refs:
      - {framework: cis_ubuntu2404_v1, ref_id: "5.2.7"}

  - control_id: HL-SUDO-004
    domain: sudo_pam
    title_es: Toda escalada de privilegios con sudo exige contraseña
    severity: high
    method: examine
    applies_to: [bastion, web, db]
    remediation: {role: accounts, tags: [sudo]}
    evidence: [sudoers]
    assertions:
      - {probe: sudoers, pattern: '^(?!ansible\s)\S+\s.*NOPASSWD', expect: absent}
      - {probe: sudoers, pattern: '^ansible\s.*NOPASSWD', expect: absent}

  - control_id: HL-PAM-001
    domain: sudo_pam
    title_es: Bloqueo de cuentas tras intentos fallidos (pam_faillock)
    severity: medium
    method: examine
    applies_to: [bastion, web, db]
    remediation: {role: accounts, tags: [pam]}
    evidence: [pam_policy]
    refs:
      - {framework: cis_ubuntu2404_v1, ref_id: "5.3.2.2"}
      - {framework: cis_ubuntu2404_v1, ref_id: "5.3.3.1.1"}
      - {framework: cis_ubuntu2404_v1, ref_id: "5.3.3.1.2"}
      - {framework: cis_ubuntu2404_v1, ref_id: "5.3.3.1.3"}
    assertions:
      - {probe: pam_policy, pattern: '^deny\s*=\s*[1-5]$'}

  - control_id: HL-PAM-002
    domain: sudo_pam
    title_es: Calidad mínima de contraseñas (pam_pwquality)
    severity: medium
    method: examine
    applies_to: [bastion, web, db]
    remediation: {role: accounts, tags: [pam]}
    evidence: [pam_policy]
    refs:
      - {framework: cis_ubuntu2404_v1, ref_id: "5.3.2.3"}
      - {framework: cis_ubuntu2404_v1, ref_id: "5.3.3.2.1"}
      - {framework: cis_ubuntu2404_v1, ref_id: "5.3.3.2.2"}
      - {framework: cis_ubuntu2404_v1, ref_id: "5.3.3.2.3"}
      - {framework: cis_ubuntu2404_v1, ref_id: "5.3.3.2.4"}
      - {framework: cis_ubuntu2404_v1, ref_id: "5.3.3.2.5"}
      - {framework: cis_ubuntu2404_v1, ref_id: "5.3.3.2.6"}
      - {framework: cis_ubuntu2404_v1, ref_id: "5.3.3.2.7"}
      - {framework: cis_ubuntu2404_v1, ref_id: "5.3.3.2.8"}
    assertions:
      - {probe: pam_policy, pattern: '^minlen\s*=\s*(1[4-9]|[2-9][0-9])$'}

  - control_id: HL-PAM-003
    domain: sudo_pam
    title_es: Historial de contraseñas impide reutilizarlas
    severity: medium
    method: examine
    applies_to: [bastion, web, db]
    remediation: {role: accounts, tags: [pam]}
    refs:
      - {framework: cis_ubuntu2404_v1, ref_id: "5.3.2.4"}
      - {framework: cis_ubuntu2404_v1, ref_id: "5.3.3.3.1"}
      - {framework: cis_ubuntu2404_v1, ref_id: "5.3.3.3.2"}
      - {framework: cis_ubuntu2404_v1, ref_id: "5.3.3.3.3"}

  - control_id: HL-PAM-004
    domain: sudo_pam
    title_es: pam_unix no admite contraseñas vacías y usa use_authtok
    severity: high
    method: examine
    applies_to: [bastion, web, db]
    remediation: {role: accounts, tags: [pam]}
    refs:
      - {framework: cis_ubuntu2404_v1, ref_id: "5.3.3.4.1"}
      - {framework: cis_ubuntu2404_v1, ref_id: "5.3.3.4.2"}
      - {framework: cis_ubuntu2404_v1, ref_id: "5.3.3.4.4"}

