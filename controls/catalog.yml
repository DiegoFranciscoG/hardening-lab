      - {framework: cis_ubuntu2404_v1, ref_id: "1.6.4"}
      - {framework: cis_ubuntu2404_v1, ref_id: "1.6.5"}
      - {framework: cis_ubuntu2404_v1, ref_id: "1.6.6"}

  # ------------------------------------------------------------------ servicios y paquetes
  - control_id: HL-SVC-001
    domain: services
    title_es: Clientes inseguros desinstalados (telnet, ftp, rsh, talk, NIS, LDAP)
    severity: medium
    method: examine
