    domain: file_permissions
    title_es: Sin directorios escribibles por todos sin sticky bit ni archivos huérfanos
    severity: medium
    method: examine
    applies_to: [bastion, web, db]
    remediation: {role: file_permissions, tags: [permissions]}
    evidence: [file_permissions]
    refs:
      - {framework: cis_ubuntu2404_v1, ref_id: "7.1.11"}
      - {framework: cis_ubuntu2404_v1, ref_id: "7.1.12"}
