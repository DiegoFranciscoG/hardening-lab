# Override de ENDURECIMIENTO del runtime (CIS Docker Benchmark, OWASP Docker Cheat Sheet, NIST SP 800-190).
# Se combina con compose.yaml: `docker compose -f compose.yaml -f compose.hardened.yaml up -d`.
# Lo que no puede aplicarse a nodos que emulan máquinas completas está en controls/exceptions.yml.

x-hardened: &hardened
  restart: on-failure:5
  cap_drop:
    - ALL
  # Mínimo para sshd/sudo/supervisor (SETUID, SETGID, SYS_CHROOT, AUDIT_WRITE...) y nftables (NET_ADMIN, namespaced).
  cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - SETUID
    - SETGID
    - KILL
    - SYS_CHROOT
    - AUDIT_WRITE
    - NET_BIND_SERVICE
    - NET_ADMIN
  pids_limit: 256
  mem_limit: 512m
  cpus: 1.0
  ulimits:
    nofile:
      soft: 4096
      hard: 8192
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m
    - /dev/shm:rw,noexec,nosuid,nodev,size=64m
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  # Parámetros de red del kernel que Docker permite fijar por contenedor (namespace de red, CIS 3.3.x).
  # net.ipv4.ip_forward NO se fija aquí: cambiarlo reinicia los demás parámetros (docs.kernel.org, ip-sysctl) y
  # Docker los aplica en orden aleatorio. Se compensa con la cadena forward en drop de nftables (EXC-005).
  sysctls:
    net.ipv6.conf.all.forwarding: 0
    net.ipv4.conf.all.send_redirects: 0
    net.ipv4.conf.default.send_redirects: 0
    net.ipv4.icmp_ignore_bogus_error_responses: 1
    net.ipv4.icmp_echo_ignore_broadcasts: 1
    net.ipv4.conf.all.accept_redirects: 0
    net.ipv4.conf.default.accept_redirects: 0
    net.ipv4.conf.all.secure_redirects: 0
    net.ipv4.conf.default.secure_redirects: 0
    net.ipv4.conf.all.rp_filter: 1
    net.ipv4.conf.default.rp_filter: 1
    net.ipv4.conf.all.accept_source_route: 0
    net.ipv4.conf.default.accept_source_route: 0
    net.ipv6.conf.all.accept_source_route: 0
    net.ipv6.conf.default.accept_source_route: 0
    net.ipv4.conf.all.log_martians: 1
    net.ipv4.conf.default.log_martians: 1
    net.ipv4.tcp_syncookies: 1
    net.ipv6.conf.all.accept_ra: 0
    net.ipv6.conf.default.accept_ra: 0
    net.ipv6.conf.all.accept_redirects: 0
    net.ipv6.conf.default.accept_redirects: 0
  labels:
    hlab.lab: "true"
    hlab.phase: hardened

services:
  bastion:
    <<: *hardened
    networks: !override
      edge:
        ipv4_address: 10.213.10.11
      admin:
        ipv4_address: 10.213.20.11

  web:
    <<: *hardened
    ports: !override
      - "127.0.0.1:${LAB_HTTP_PORT:-18080}:8080"
      - "127.0.0.1:${LAB_HTTPS_PORT:-18443}:8443"
    networks: !override
      edge:
        ipv4_address: 10.213.10.12
      admin:
        ipv4_address: 10.213.20.12
      data:
        ipv4_address: 10.213.30.12

  db:
    <<: *hardened
    ports: !reset []
    networks: !override
      admin:
        ipv4_address: 10.213.20.13
      data:
        ipv4_address: 10.213.30.13

  controller:
    networks: !override
      edge:
        ipv4_address: 10.213.10.10

networks:
  # Segmentación: solo `edge` tiene salida; administración y datos son redes internas.
  edge:
    ipam:
      config:
        - subnet: 10.213.10.0/24
  admin:
    internal: true
    ipam:
      config:
        - subnet: 10.213.20.0/24
  data:
    internal: true
    ipam:
      config:
        - subnet: 10.213.30.0/24
