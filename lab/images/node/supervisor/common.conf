; Servicios comunes de todos los nodos. En el baseline rsyslog está apagado (sin registros de autenticación).
[program:sshd]
command=/usr/sbin/sshd -D -e
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:cron]
command=/usr/sbin/cron -f
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:rsyslog]
command=/usr/sbin/rsyslogd -n -iNONE
autostart=false
autorestart=true
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
