[project]
name = "hardening-lab"
version = "1.0.0"
description = "Normaliza auditorías (Lynis, OpenSCAP, docker-bench, Trivy), mide cumplimiento antes/después y detecta deriva de configuración."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Diego Francisco Granda Zhingre" }]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.13,<3",
    "pyyaml>=6.0.3,<7",
    "jinja2>=3.1.6,<4",
    "matplotlib>=3.11,<4",
    "defusedxml>=0.7.1,<0.8",
]

[project.optional-dependencies]
controller = ["ansible-core>=2.21.4,<2.22"]

[project.scripts]
hlab = "hardening_lab.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "mypy>=2.4",
    "ruff>=0.16.10",
    "types-PyYAML>=6.0.12.20260906",
    "pre-commit>=4.6",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hardening_lab"]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PTH", "C4", "PL"]
# PLC0415: la CLI importa matplotlib y Jinja solo en los subcomandos que los usan.
# RUF001-003: el texto en español usa tipografía correcta (×, –, «»).
ignore = ["PLR0913", "PLR2004", "PLR0911", "PLR0912", "PLR0917", "PLC0415", "S603", "S607", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S108"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["defusedxml.*", "matplotlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["hardening_lab"]
branch = true

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = true
