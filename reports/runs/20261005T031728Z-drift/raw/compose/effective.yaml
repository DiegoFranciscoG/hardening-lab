name: hlab
services:
  bastion:
    build:
      context: images/node
      dockerfile: Dockerfile
      args:
        LAB_ROLE: bastion
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
      - KILL
      - SYS_CHROOT
      - AUDIT_WRITE
      - NET_BIND_SERVICE
      - NET_ADMIN
    cap_drop:
      - ALL
    cpus: 1
    container_name: lab-bastion
    depends_on:
      keygen:
        condition: service_completed_successfully
        required: true
    hostname: lab-bastion
    image: hlab/node-bastion:1.0.0
    labels:
      hlab.lab: "true"
      hlab.phase: hardened
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m
    mem_limit: "536870912"
    networks:
      admin:
        ipv4_address: 10.213.20.11
      edge:
        ipv4_address: 10.213.10.11
    pids_limit: 256
    ports:
      - mode: ingress
        host_ip: 127.0.0.1
        target: 22
        published: "2222"
        protocol: tcp
    restart: on-failure:5
    sysctls:
      net.ipv4.conf.all.accept_redirects: "0"
      net.ipv4.conf.all.accept_source_route: "0"
      net.ipv4.conf.all.log_martians: "1"
      net.ipv4.conf.all.rp_filter: "1"
      net.ipv4.conf.all.secure_redirects: "0"
      net.ipv4.conf.all.send_redirects: "0"
      net.ipv4.conf.default.accept_redirects: "0"
      net.ipv4.conf.default.accept_source_route: "0"
      net.ipv4.conf.default.log_martians: "1"
      net.ipv4.conf.default.rp_filter: "1"
      net.ipv4.conf.default.secure_redirects: "0"
      net.ipv4.conf.default.send_redirects: "0"
      net.ipv4.icmp_echo_ignore_broadcasts: "1"
      net.ipv4.icmp_ignore_bogus_error_responses: "1"
      net.ipv4.tcp_syncookies: "1"
      net.ipv6.conf.all.accept_ra: "0"
      net.ipv6.conf.all.accept_redirects: "0"
      net.ipv6.conf.all.accept_source_route: "0"
      net.ipv6.conf.all.forwarding: "0"
      net.ipv6.conf.default.accept_ra: "0"
      net.ipv6.conf.default.accept_redirects: "0"
      net.ipv6.conf.default.accept_source_route: "0"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
      - /dev/shm:rw,noexec,nosuid,nodev,size=64m
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    volumes:
      - type: volume
        source: ssh_public
        target: /etc/lab-keys
        read_only: true
        volume: {}
  db:
    build:
      context: images/node
      dockerfile: Dockerfile
      args:
        LAB_ROLE: db
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
      - KILL
      - SYS_CHROOT
      - AUDIT_WRITE
      - NET_BIND_SERVICE
      - NET_ADMIN
    cap_drop:
      - ALL
    cpus: 1
    container_name: lab-db
    depends_on:
      keygen:
        condition: service_completed_successfully
        required: true
    hostname: lab-db
    image: hlab/node-db:1.0.0
    labels:
      hlab.lab: "true"
      hlab.phase: hardened
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m
    mem_limit: "536870912"
    networks:
      admin:
        ipv4_address: 10.213.20.13
      data:
        ipv4_address: 10.213.30.13
    pids_limit: 256
    restart: on-failure:5
    sysctls:
      net.ipv4.conf.all.accept_redirects: "0"
      net.ipv4.conf.all.accept_source_route: "0"
      net.ipv4.conf.all.log_martians: "1"
      net.ipv4.conf.all.rp_filter: "1"
      net.ipv4.conf.all.secure_redirects: "0"
      net.ipv4.conf.all.send_redirects: "0"
      net.ipv4.conf.default.accept_redirects: "0"
      net.ipv4.conf.default.accept_source_route: "0"
      net.ipv4.conf.default.log_martians: "1"
      net.ipv4.conf.default.rp_filter: "1"
      net.ipv4.conf.default.secure_redirects: "0"
      net.ipv4.conf.default.send_redirects: "0"
      net.ipv4.icmp_echo_ignore_broadcasts: "1"
      net.ipv4.icmp_ignore_bogus_error_responses: "1"
      net.ipv4.tcp_syncookies: "1"
      net.ipv6.conf.all.accept_ra: "0"
      net.ipv6.conf.all.accept_redirects: "0"
      net.ipv6.conf.all.accept_source_route: "0"
      net.ipv6.conf.all.forwarding: "0"
      net.ipv6.conf.default.accept_ra: "0"
      net.ipv6.conf.default.accept_redirects: "0"
      net.ipv6.conf.default.accept_source_route: "0"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
      - /dev/shm:rw,noexec,nosuid,nodev,size=64m
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    volumes:
      - type: volume
        source: ssh_public
        target: /etc/lab-keys
        read_only: true
        volume: {}
  keygen:
    command:
      - set -eu; [ -f /keys/private/id_ed25519 ] || ssh-keygen -q -t ed25519 -N '' -C hlab-automation -f /keys/private/id_ed25519; cp /keys/private/id_ed25519.pub /keys/public/authorized_keys; chown 10001:10001 /keys/private/id_ed25519 /keys/private/id_ed25519.pub; chmod 0600 /keys/private/id_ed25519; chmod 0644 /keys/public/authorized_keys
    entrypoint:
      - /bin/sh
      - -c
    image: hlab/controller:1.0.0
    network_mode: none
    user: "0:0"
    volumes:
      - type: volume
        source: ssh_private
        target: /keys/private
        volume: {}
      - type: volume
        source: ssh_public
        target: /keys/public
        volume: {}
  web:
    build:
      context: images/node
      dockerfile: Dockerfile
      args:
        LAB_ROLE: web
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
      - KILL
      - SYS_CHROOT
      - AUDIT_WRITE
      - NET_BIND_SERVICE
      - NET_ADMIN
    cap_drop:
      - ALL
    cpus: 1
    container_name: lab-web
    depends_on:
      keygen:
        condition: service_completed_successfully
        required: true
    hostname: lab-web
    image: hlab/node-web:1.0.0
    labels:
      hlab.lab: "true"
      hlab.phase: hardened
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m
    mem_limit: "536870912"
    networks:
      admin:
        ipv4_address: 10.213.20.12
      data:
        ipv4_address: 10.213.30.12
      edge:
        ipv4_address: 10.213.10.12
    pids_limit: 256
    ports:
      - mode: ingress
        host_ip: 127.0.0.1
        target: 8080
        published: "18080"
        protocol: tcp
      - mode: ingress
        host_ip: 127.0.0.1
        target: 8443
        published: "18443"
        protocol: tcp
    restart: on-failure:5
    sysctls:
      net.ipv4.conf.all.accept_redirects: "0"
      net.ipv4.conf.all.accept_source_route: "0"
      net.ipv4.conf.all.log_martians: "1"
      net.ipv4.conf.all.rp_filter: "1"
      net.ipv4.conf.all.secure_redirects: "0"
      net.ipv4.conf.all.send_redirects: "0"
      net.ipv4.conf.default.accept_redirects: "0"
      net.ipv4.conf.default.accept_source_route: "0"
      net.ipv4.conf.default.log_martians: "1"
      net.ipv4.conf.default.rp_filter: "1"
      net.ipv4.conf.default.secure_redirects: "0"
      net.ipv4.conf.default.send_redirects: "0"
      net.ipv4.icmp_echo_ignore_broadcasts: "1"
      net.ipv4.icmp_ignore_bogus_error_responses: "1"
      net.ipv4.tcp_syncookies: "1"
      net.ipv6.conf.all.accept_ra: "0"
      net.ipv6.conf.all.accept_redirects: "0"
      net.ipv6.conf.all.accept_source_route: "0"
      net.ipv6.conf.all.forwarding: "0"
      net.ipv6.conf.default.accept_ra: "0"
      net.ipv6.conf.default.accept_redirects: "0"
      net.ipv6.conf.default.accept_source_route: "0"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
      - /dev/shm:rw,noexec,nosuid,nodev,size=64m
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    volumes:
      - type: volume
        source: ssh_public
        target: /etc/lab-keys
        read_only: true
        volume: {}
networks:
  admin:
    name: hlab_admin
    ipam:
      config:
        - subnet: 10.213.20.0/24
    internal: true
  data:
    name: hlab_data
    ipam:
      config:
        - subnet: 10.213.30.0/24
    internal: true
  edge:
    name: hlab_edge
    ipam:
      config:
        - subnet: 10.213.10.0/24
volumes:
  ssh_private:
    name: hlab_ssh_private
  ssh_public:
    name: hlab_ssh_public
x-hardened:
  cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - SETUID
    - SETGID
    - KILL
    - SYS_CHROOT
    - AUDIT_WRITE
    - NET_BIND_SERVICE
    - NET_ADMIN
  cap_drop:
    - ALL
  cpus: 1
  labels:
    hlab.lab: "true"
    hlab.phase: hardened
  logging:
    driver: json-file
    options:
      max-file: "3"
      max-size: 10m
  mem_limit: 512m
  pids_limit: 256
  restart: on-failure:5
  sysctls:
    net.ipv4.conf.all.accept_redirects: 0
    net.ipv4.conf.all.accept_source_route: 0
    net.ipv4.conf.all.log_martians: 1
    net.ipv4.conf.all.rp_filter: 1
    net.ipv4.conf.all.secure_redirects: 0
    net.ipv4.conf.all.send_redirects: 0
    net.ipv4.conf.default.accept_redirects: 0
    net.ipv4.conf.default.accept_source_route: 0
    net.ipv4.conf.default.log_martians: 1
    net.ipv4.conf.default.rp_filter: 1
    net.ipv4.conf.default.secure_redirects: 0
    net.ipv4.conf.default.send_redirects: 0
    net.ipv4.icmp_echo_ignore_broadcasts: 1
    net.ipv4.icmp_ignore_bogus_error_responses: 1
    net.ipv4.tcp_syncookies: 1
    net.ipv6.conf.all.accept_ra: 0
    net.ipv6.conf.all.accept_redirects: 0
    net.ipv6.conf.all.accept_source_route: 0
    net.ipv6.conf.all.forwarding: 0
    net.ipv6.conf.default.accept_ra: 0
    net.ipv6.conf.default.accept_redirects: 0
    net.ipv6.conf.default.accept_source_route: 0
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m
    - /dev/shm:rw,noexec,nosuid,nodev,size=64m
  ulimits:
    nofile:
      hard: 8192
      soft: 4096
x-node:
  depends_on:
    keygen:
      condition: service_completed_successfully
  labels:
    hlab.lab: "true"
  restart: always
  volumes:
    - ssh_public:/etc/lab-keys:ro
